<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MAZARO CLASSIC</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

   
<nav>
    <a href="index.html">الرئيسية</a>
    <a href="index.html#about">عن MAZARO</a>
    <a href="index.html#contact">تواصل معنا</a>

    <button type="button" class="cart-toggle" onclick="toggleCart()">
        🛒
        <span id="cart-count">0</span>
    </button>
</nav>

    <header class="collection-header">
        <h1>MAZARO CLASSIC</h1>
        <p>Timeless Elegance</p>
        <p class="arabic-subtitle">أناقة خالدة</p>
    </header>

    <section id="products">
        <h2>OUR PRODUCTS</h2>
        <p class="arabic-subtitle">منتجات المجموعة</p>
    </section>

<div id="cart-overlay" onclick="toggleCart()"></div>

<section id="cart" class="cart-drawer">

    <div class="cart-header">
        <div>
            <h2>YOUR BAG</h2>
            <p>حقيبة مشترياتك من MAZARO</p>
        </div>
        <button type="button" onclick="toggleCart()">✕</button>
    </div>

    <div class="cart-table-wrapper">
        <table class="cart-table">
            <thead>
                <tr>
                    <th>المنتج</th>
                    <th>المقاس</th>
                    <th>السعر</th>
                    <th>الكمية</th>
                    <th>الإجمالي</th>
                    <th>حذف</th>
                </tr>
            </thead>

            <tbody id="cart-items">
                <tr>
                    <td colspan="6">حقيبتك فارغة حالياً</td>
                </tr>
            </tbody>
        </table>
    </div>

    <div class="cart-summary">
        <p>إجمالي الطلب</p>
        <h2><span id="cart-total">0</span> EGP</h2>

        <div class="customer-details">
            <input type="text" id="customer-name" placeholder="الاسم بالكامل">
            <input type="tel" id="customer-phone" placeholder="رقم الهاتف">
            <input type="text" id="customer-address" placeholder="العنوان بالتفصيل">
            <textarea id="customer-notes" placeholder="ملاحظات إضافية (اختياري)"></textarea>
        </div>

        <button type="button" class="clear-cart-btn" onclick="clearCart()">
            تفريغ السلة
        </button>

        <button type="button" onclick="checkout()">
            إتمام الطلب عبر WhatsApp
        </button>
    </div>

</section>

<script src="cart.js"></script>
</body>
</html>
